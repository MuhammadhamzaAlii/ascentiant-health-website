# Ascentiant Health — static site deployment
# Deploy: drag folder to Netlify, or connect repo and set publish directory to "."

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Clean URLs optional — site uses .html extensions
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Netlify automatically serves 404.html for missing pages when placed in publish root.

